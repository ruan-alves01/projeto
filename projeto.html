<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Escolar - Acesso</title>
  <link rel="stylesheet" href="projeto.css">
</head>
<body>

  <div class="container-principal">

    <section class="lado-banner">
      <h1>Portal Escolar</h1>
      <p class="banner-texto">Acompanhe a vida escolar do aluno em um só lugar.</p>

      <ul class="lista-banner">
        <li>Aulas e horários</li>
        <li>Notas e boletim</li>
        <li>Turmas</li>
        <li>Reuniões e calendário escolar</li>
        <li>Mensalidades</li>
      </ul>
    </section>

    <section class="lado-login">
      <div class="caixa-login">
        <h2>Acesso ao Portal</h2>
        <p>Entre com seu e-mail e sua senha para abrir o painel do aluno.</p>

        <form action="pg1/pg1.html" target="_blank" rel="noopener">
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="username" required>
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
          </div>

          <button type="submit">Entrar</button>
        </form>

        <p class="rodape-login">Portal Escolar - Ano Letivo 2026</p>
      </div>
    </section>

  </div>

</body>
</html>
